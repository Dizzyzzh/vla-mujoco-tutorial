[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-mujoco-sorting"
version = "0.2.0"
description = "Language-Conditioned 3D Obstacle-Crossing Manipulation & OOD Evaluation Benchmark with MuJoCo and SmolVLA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1.6",
    "glfw>=2.7.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "opencv-python-headless>=4.8.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "safetensors>=0.5.0",
    "datasets>=3.4.0",
    "transformers>=4.50.0",
    "accelerate>=1.2.0",
    "lerobot>=0.7.0",
]

[project.optional-dependencies]
vla = [
    "lerobot[smolvla]>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
vla-collect = "scripts.collectData:main"
vla-replay = "scripts.visualizeData:main"
vla-train = "scripts.train_smolvla:main"
vla-eval = "scripts.eval_benchmark:main"
vla-deploy = "scripts.deploy:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mujoco_env*", "scripts*"]
exclude = ["dataset*", "ckpt*", "eval_results*"]
